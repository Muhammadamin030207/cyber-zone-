
services:
  # PostgreSQL ma'lumotlar bazasi
  - type: pgsql
    name: cyberarena-db
    plan: free
    database: cyberarena
    user: cyberarena
    ipAllowList: []

  # Redis
  - type: redis
    name: cyberarena-redis
    plan: free

  # Backend API (frontend Vercel'da)
  - type: web
    name: cyberarena-api
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberarena-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: cyberarena-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Vercel'dagi frontend domenlari (vergul bilan bir nechta bo'lishi mumkin):
      - key: FRONTEND_URLS
        value: https://cyber-zone-delta.vercel.app, https://frontend-six-bay-25.vercel.app, https://frontend-fullstacks-projects-ffc4c9c9.vercel.app, https://cyber-zone-fullstacks-projects-ffc4c9c9.vercel.app, http://localhost:3006
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      # Gemini AI — Render dashboard'da qo'lda o'rnating
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Claude AI — ANTHROPIC_API_KEY o'rnatilsa Claude ustunlik bilan ishlatiladi
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      # Parol tiklash email'i uchun SMTP (Brevo relay — secret, Render dashboard'da qo'lda).
      # Render free web service'lari 25/465/587 portlariga chiquvchi trafikni bloklaydi,
      # shuning uchun Brevo'ning 2525-porti ishlatiladi (STARTTLS).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 2525
      - key: EMAIL_USE_TLS
        value: "false"
      - key: EMAIL_FALLBACK_PORTS
        value: "2525"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Muddati o'tgan to'lanmagan bron avtomatik bekor qilingan vaqt (daqiqa)
      - key: UNPAID_BOOKING_TTL_MINUTES
        value: 60
      # To'lov provayderlari callback/webhook bazaviy URL — mahalliy "localhost"ga tushmaslik
      - key: PROVIDER_CALLBACK_URL
        value: https://cyberzone-backend-api.onrender.com
      # --- To'lov provayderlari (real credential Render dashboard'da qo'lda qo'yiladi) ---
      # Bo'sh qolsa provider "CONFIGURATION REQUIRED" holatida ko'rinadi — fake success chiqmaydi.
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_MERCHANT_KEY
        sync: false
      - key: PAYME_API_ENDPOINT
        value: https://checkout.payme.uz
      - key: PAYME_CHECKOUT_URL
        value: https://checkout.payme.uz
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: CLICK_CHECKOUT_URL
        value: https://my.click.uz/services/pay
      - key: UZUM_MERCHANT_ID
        sync: false
      - key: UZUM_SECRET_KEY
        sync: false
      - key: UZUM_API_ENDPOINT
        value: https://checkoutapi.uzumbank.uz
      - key: UZUM_CHECKOUT_URL
        value: https://www.uzumcheckout.uz
      - key: PAYNET_MERCHANT_ID
        sync: false
      - key: PAYNET_PASSWORD
        sync: false
      - key: PAYNET_SERVICE_ID
        sync: false
      - key: PAYNET_API_ENDPOINT
        value: https://api.paynet.uz/api
      - key: PAYNET_CHECKOUT_URL
        value: https://app.paynet.uz
      # Depozit minimal foizi (30% standart business logic; min chegara 10%)
      - key: MIN_DEPOSIT_PERCENT
        value: "30"
      # Login brute-force: 10-chi xato urinishdan keyin hisob 24-soatga bloklanadi (§4.2)
      - key: LOGIN_LOCK_MINUTES
        value: "1440"
      - key: LOGIN_MAX_ATTEMPTS
        value: "10"
      # WebAuthn: Frontend domeni (passkey bog'langan origin)
      - key: WEBAUTHN_RP_ID
        value: cyber-zone-delta.vercel.app
      - key: WEBAUTHN_EXPECTED_ORIGINS
        value: https://cyber-zone-delta.vercel.app, https://frontend-six-bay-25.vercel.app, https://frontend-fullstacks-projects-ffc4c9c9.vercel.app, https://cyber-zone-fullstacks-projects-ffc4c9c9.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000